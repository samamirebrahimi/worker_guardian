[project]
name = "worker-guardian"
version = "0.1.0"
description = "Fleet manager daemon with Postgres heartbeat monitoring — spawns, monitors, and respawns heterogeneous worker processes"
readme = "docs/DESIGN.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "psutil>=6.0",
    "pydantic>=2.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
worker-guardian = "worker_guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_guardian"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
